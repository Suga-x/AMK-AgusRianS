[options]

; Database - disesuaikan dengan nama service database di Compose
db_host = db-odoo-18
db_port = 5432
db_user = odoo
db_password = odoo

; Addons - disesuaikan dengan mount path folder custom di docker-compose.yaml
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons/custom

; Data directory
data_dir = /var/lib/odoo

; Admin password untuk database manager
admin_passwd = admin123

; Network
http_port = 8069
proxy_mode = False

; Logging - dikosongkan agar log tampil di terminal/Docker Desktop
logfile = 
log_level = info

; Limits
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560
limit_time_cpu = 600
limit_time_real = 1200